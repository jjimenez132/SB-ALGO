name: Daily NBA Games

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  fetch-games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests psycopg2-binary
      
      - name: Fetch yesterday's games
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python3 daily_games.py
