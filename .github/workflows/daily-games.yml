name: Daily NBA Games Update

on:
  schedule:
    # Runs at 3 AM EST (8 AM UTC) daily
    - cron: '0 8 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-games:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install psycopg2-binary
        pip install requests
        pip install nba_api
        pip install numpy pandas
    
    - name: Run daily games updater
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        echo "🏀 Starting NBA daily games update..."
        echo "📅 Date: $(date)"
        python daily_games.py
    
    - name: Verify update
      if: always()
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        python -c "
        import psycopg2
        import os
        from datetime import datetime, timedelta
        
        conn = psycopg2.connect(os.environ['DATABASE_URL'])
        cur = conn.cursor()
        
        yesterday = (datetime.now() - timedelta(days=1)).date()
        
        cur.execute('''
          SELECT COUNT(*) FROM games WHERE game_date = %s
        ''', (yesterday,))
        
        game_count = cur.fetchone()[0]
        
        cur.execute('''
          SELECT COUNT(*) FROM player_boxscores pb
          JOIN games g ON pb.game_id = g.game_id
          WHERE g.game_date = %s
        ''', (yesterday,))
        
        stats_count = cur.fetchone()[0]
        
        print(f'✅ Verification Results:')
        print(f'  Games for {yesterday}: {game_count}')
        print(f'  Player stats entries: {stats_count}')
        
        if game_count == 0:
          print('⚠️ WARNING: No games found for yesterday!')
          exit(1)
        
        cur.close()
        conn.close()
        "
